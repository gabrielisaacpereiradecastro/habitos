<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Hábitos</title>

<!-- iOS "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hábitos" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2a78d6" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"></script>

<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface-1:       #fcfcfb;
    --surface-2:       #ffffff;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --baseline:        #c3c2b7;
    --series-1:        #2a78d6;
    --series-1-soft:   #cde2fb;
    --good:            #006300;
    --critical:        #d03b3b;
    --critical-soft:   #fbe4e3;
    --border:          rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface-1:       #1a1a19;
      --surface-2:       #222221;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --gridline:        #2c2c2a;
      --baseline:        #383835;
      --series-1:        #3987e5;
      --series-1-soft:   #17324f;
      --good:            #0ca30c;
      --critical:        #e66767;
      --critical-soft:   #3a2020;
      --border:          rgba(255,255,255,0.10);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior-y: none;
  }
  #app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 0 16px 96px; }

  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4px 10px;
  }
  header.topbar .title { font-size: 22px; font-weight: 700; }
  header.topbar .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; border: none;
    background: var(--surface-2); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer;
  }
  .icon-btn:active { opacity: 0.7; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  /* ---------- home list ---------- */
  .habit-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; margin-bottom: 10px;
  }
  .habit-row .emoji { font-size: 24px; width: 30px; text-align: center; flex-shrink: 0; }
  .habit-row .info { flex: 1; min-width: 0; cursor: pointer; }
  .habit-row .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-row .meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .habit-row .meta .streak { color: var(--text-secondary); }
  .habit-row .edit-btn {
    background: none; border: none; color: var(--text-muted); font-size: 16px;
    padding: 8px; cursor: pointer; flex-shrink: 0;
  }
  .check-toggle {
    width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0;
    border: 2px solid var(--baseline); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: transparent; cursor: pointer;
  }
  .check-toggle.done { color: #fff; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 999px; border: none;
    background: var(--series-1); color: #fff; font-size: 28px; font-weight: 400;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    max-width: 520px; margin: 0 auto;
  }

  /* ---------- detail view ---------- */
  .detail-head { display: flex; align-items: center; gap: 10px; padding: 16px 2px 4px; }
  .detail-head .emoji { font-size: 26px; }
  .detail-head .name { font-size: 20px; font-weight: 700; flex: 1; }

  .stat-row { display: flex; gap: 10px; margin: 14px 0; }
  .stat-tile {
    flex: 1; padding: 12px 10px; border-radius: 14px;
    background: var(--surface-1); border: 1px solid var(--border);
    text-align: center;
  }
  .stat-tile .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 22px 2px 10px; text-transform: uppercase; letter-spacing: 0.02em; }

  .viz-card { padding: 14px 12px; }
  .viz-card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .cell { cursor: pointer; }
  .tooltip-line { font-size: 13px; color: var(--text-secondary); text-align: center; min-height: 18px; margin-top: 8px; }
  .tooltip-line b { color: var(--text-primary); }

  .back-btn { background: none; border: none; color: var(--series-1); font-size: 16px; padding: 6px 6px 6px 0; cursor: pointer; }

  /* ---------- modal / overlay ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .sheet {
    background: var(--surface-1); width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-primary); font-size: 16px;
  }
  .field.emoji-field input { width: 64px; text-align: center; font-size: 22px; }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--series-1); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-danger { background: var(--critical-soft); color: var(--critical); }
  .help-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .field select {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-primary); font-size: 16px;
  }

  .edit-btn:disabled { opacity: 0.3; }
  .habit-row .info.no-pointer { cursor: default; }
  .check-toggle:disabled { opacity: 0.25; cursor: default; }

  .date-strip { display: flex; align-items: center; gap: 2px; margin: 4px 0 16px; }
  .date-strip .nav-btn {
    background: none; border: none; color: var(--text-muted); font-size: 18px;
    padding: 6px 4px; cursor: pointer; flex-shrink: 0;
  }
  .date-strip .nav-btn:disabled { opacity: 0.25; cursor: default; }
  .date-strip .days { display: flex; flex: 1; justify-content: space-between; }
  .date-day {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 2px 0; flex: 1; -webkit-tap-highlight-color: transparent;
  }
  .date-day .dow { font-size: 11px; color: var(--text-muted); }
  .date-day .num {
    width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 600; color: var(--text-primary);
    border: 1.5px solid transparent;
  }
  .date-day.today .num { border-color: var(--series-1); }
  .date-day.selected .num { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .date-day.future { opacity: 0.3; cursor: default; }

  .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 999px; border: 2px solid transparent;
    cursor: pointer; padding: 0; position: relative; flex-shrink: 0;
  }
  .swatch.selected { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--surface-1); }
  .custom-swatch {
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    overflow: hidden;
  }
  .custom-swatch input[type="color"] {
    opacity: 0; width: 40px; height: 40px; border: none; padding: 0; cursor: pointer;
  }

  .archived-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 6px; border-bottom: 1px solid var(--border);
  }
  .archived-row:last-child { border-bottom: none; }
  .archived-row .name { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .archived-row button {
    font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer;
  }

  a { color: var(--series-1); }

  /* ---------- fotos de progresso ---------- */
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .photo-slot {
    aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; position: relative;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-slot .placeholder { color: var(--text-muted); font-size: 12px; text-align: center; padding: 8px; }
  .photo-slot .angle-label {
    position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,0.55); color: #fff; padding: 2px 7px; border-radius: 999px;
  }
  .photo-slot input[type="file"] { display: none; }

  .checkin-row { padding: 12px 14px; margin-bottom: 10px; }
  .checkin-row .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .checkin-row .date { font-size: 14px; font-weight: 600; }
  .checkin-row .metrics { font-size: 12.5px; color: var(--text-secondary); }
  .checkin-row .thumbs { display: flex; gap: 6px; }
  .checkin-row .thumbs .t {
    width: 52px; height: 68px; border-radius: 8px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-muted);
  }
  .checkin-row .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .checkin-row .del-btn { background: none; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 4px; }

  .angle-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .angle-tabs button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-secondary); font-size: 13px; cursor: pointer;
  }
  .angle-tabs button.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }

  .player-frame {
    width: 100%; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .player-frame img { width: 100%; height: 100%; object-fit: cover; }
  .player-frame .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px; }
  .player-frame .date-badge {
    position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,0.55); color: #fff; padding: 3px 9px; border-radius: 999px;
  }
  .player-controls { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .player-controls .icon-btn { flex-shrink: 0; }
  .player-controls input[type="range"] { flex: 1; }
  .speed-label { font-size: 12px; color: var(--text-secondary); min-width: 46px; text-align: right; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ============================= CONFIG ============================= */
  const SUPABASE_URL = "https://skrbznskktophlwdfkci.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_cEp3tBod3WgWo0k543WG6g_qJcKWgJB";
  // fixa (em vez de derivar de location.pathname) porque o app instalado na tela de
  // início abre em ".../habitos/index.html", diferente da URL cadastrada nas Redirect
  // URLs do Supabase (".../habitos/") — isso fazia o login cair no fallback errado
  const APP_URL = "https://gabrielisaacpereiradecastro.github.io/habitos/";

  let sb = null;
  function client() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error("Biblioteca do Supabase não carregou. Confira sua conexão com a internet e recarregue a página.");
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return sb;
  }

  /* ============================= AUTH ============================= */
  let currentUser = null;

  async function signInWithGoogle() {
    const { error } = await client().auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: APP_URL },
    });
    if (error) throw error;
  }

  async function signOut() {
    await client().auth.signOut();
  }

  /* ============================= UTIL ============================= */
  const $app = document.getElementById("app");
  const WEEKDAYS_SHORT = ["dom","seg","ter","qua","qui","sex","sáb"];
  const MONTHS_SHORT = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  function todayStr() { return dateToStr(new Date()); }
  function dateToStr(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function strToDate(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function fmtShort(d) { return `${d.getDate()}/${d.getMonth()+1}`; }
  function fmtLong(d) { return `${WEEKDAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // janela usada tanto pra estatísticas da home quanto pro heatmap/tendência do detalhe
  const WEEKS = 18;
  const DAYS = WEEKS * 7;

  const HABIT_COLORS = [
    "#2a78d6", "#1f9254", "#d9781f", "#d94f4f", "#8b5cf6",
    "#e0559a", "#17a2b8", "#c99a1e", "#9c6b3e", "#6b7280", "#4f5fd9", "#7cb342",
  ];
  const DEFAULT_COLOR = HABIT_COLORS[0];

  /* ============================= ROUTER ============================= */
  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", () => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    client().auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      render();
    });
  });

  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    if (h.startsWith("habit/")) return { name: "detail", id: h.slice(6) };
    if (h === "settings") return { name: "settings" };
    if (h === "photos") return { name: "photos" };
    if (h.startsWith("photos/player")) return { name: "photo-player" };
    return { name: "home" };
  }

  function render() {
    if (!currentUser) { renderLogin(); return; }
    const r = route();
    if (r.name === "settings") return renderSettings();
    if (r.name === "detail") return renderDetail(r.id);
    if (r.name === "photos") return renderPhotos();
    if (r.name === "photo-player") return renderPhotoPlayer();
    return renderHome();
  }

  function renderLogin() {
    $app.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:85vh; padding:24px; text-align:center;">
        <div style="font-size:48px; margin-bottom:12px;">✅</div>
        <div style="font-size:22px; font-weight:700; margin-bottom:8px;">Hábitos</div>
        <p class="help-text" style="margin-bottom:24px;">Entre com sua conta Google pra ver e marcar seus hábitos.</p>
        <button class="btn btn-primary" id="google-login" style="flex:none; padding:14px 28px;">Continuar com Google</button>
        <p class="help-text" id="login-error" style="color:var(--critical); margin-top:16px;"></p>
      </div>
    `;
    document.getElementById("google-login").onclick = async () => {
      try { await signInWithGoogle(); }
      catch (e) { document.getElementById("login-error").textContent = "Erro: " + e.message; }
    };
  }

  /* ============================= DATA ACCESS ============================= */
  async function fetchHabits() {
    const { data, error } = await client()
      .from("habits").select("*").eq("archived", false)
      .order("sort_order", { ascending: true }).order("created_at", { ascending: true });
    if (error) throw error;
    return data || [];
  }

  async function fetchArchivedHabits() {
    const { data, error } = await client()
      .from("habits").select("*").eq("archived", true)
      .order("created_at", { ascending: false });
    if (error) throw error;
    return data || [];
  }

  async function fetchRecentLogs(days) {
    const since = dateToStr(addDays(new Date(), -(days - 1)));
    const { data, error } = await client()
      .from("habit_logs").select("habit_id, log_date").gte("log_date", since);
    if (error) throw error;
    const map = {};
    for (const row of (data || [])) {
      (map[row.habit_id] ||= new Set()).add(row.log_date);
    }
    return map;
  }

  async function fetchHabitLogs(habitId, days) {
    const since = dateToStr(addDays(new Date(), -(days - 1)));
    const { data, error } = await client()
      .from("habit_logs").select("log_date").eq("habit_id", habitId).gte("log_date", since);
    if (error) throw error;
    return new Set((data || []).map(r => r.log_date));
  }

  async function fetchHabitTotal(habitId) {
    const { count, error } = await client()
      .from("habit_logs").select("id", { count: "exact", head: true }).eq("habit_id", habitId);
    if (error) throw error;
    return count || 0;
  }

  async function toggleLog(habitId, dateStr, done) {
    if (done) {
      await client().from("habit_logs").insert({ habit_id: habitId, log_date: dateStr, user_id: currentUser.id });
    } else {
      await client().from("habit_logs").delete().eq("habit_id", habitId).eq("log_date", dateStr);
    }
  }

  async function createHabit(name, emoji, targetPerWeek, color) {
    const { count } = await client()
      .from("habits").select("id", { count: "exact", head: true }).eq("archived", false);
    const { data, error } = await client()
      .from("habits")
      .insert({ name, emoji: emoji || "✅", target_per_week: targetPerWeek || 7, color: color || DEFAULT_COLOR, sort_order: count || 0, user_id: currentUser.id })
      .select().single();
    if (error) throw error;
    return data;
  }
  async function updateHabit(id, fields) {
    const { error } = await client().from("habits").update(fields).eq("id", id);
    if (error) throw error;
  }
  async function deleteHabit(id) {
    const { error } = await client().from("habits").delete().eq("id", id);
    if (error) throw error;
  }

  /* ============================= BODY CHECKINS (fotos) ============================= */
  const PHOTO_BUCKET = "body-photos";
  const ANGLES = [
    { key: "front", label: "Frente" },
    { key: "back", label: "Costas" },
    { key: "left", label: "Esquerda" },
    { key: "right", label: "Direita" },
  ];

  // redimensiona pro lado maior ter no máx 1080px antes de subir, economiza espaço/banda
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxSide = 1080;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Falha ao comprimir imagem")), "image/jpeg", 0.82);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadCheckinPhoto(dateStr, angleKey, file) {
    const blob = await compressImage(file);
    const path = `${currentUser.id}/${dateStr}/${angleKey}.jpg`;
    const { error } = await client().storage.from(PHOTO_BUCKET)
      .upload(path, blob, { upsert: true, contentType: "image/jpeg" });
    if (error) throw error;
    return path;
  }

  const signedUrlCache = new Map();
  async function getSignedUrl(path) {
    if (!path) return null;
    if (signedUrlCache.has(path)) return signedUrlCache.get(path);
    const { data, error } = await client().storage.from(PHOTO_BUCKET).createSignedUrl(path, 3600);
    if (error) throw error;
    signedUrlCache.set(path, data.signedUrl);
    return data.signedUrl;
  }

  async function fetchCheckins() {
    const { data, error } = await client()
      .from("body_checkins").select("*").order("checkin_date", { ascending: false });
    if (error) throw error;
    return data || [];
  }

  async function upsertCheckin(dateStr, fields) {
    const { data, error } = await client()
      .from("body_checkins")
      .upsert({ user_id: currentUser.id, checkin_date: dateStr, ...fields }, { onConflict: "user_id,checkin_date" })
      .select().single();
    if (error) throw error;
    return data;
  }

  async function deleteCheckin(checkin) {
    const paths = ANGLES.map(a => checkin[`photo_${a.key}`]).filter(Boolean);
    if (paths.length) await client().storage.from(PHOTO_BUCKET).remove(paths);
    const { error } = await client().from("body_checkins").delete().eq("id", checkin.id);
    if (error) throw error;
  }

  /* ============================= STREAK / STATS ============================= */
  function computeStreak(datesSet) {
    let streak = 0;
    let cursor = new Date();
    if (!datesSet.has(dateToStr(cursor))) cursor = addDays(cursor, -1); // hoje ainda pendente não quebra a sequência
    while (datesSet.has(dateToStr(cursor))) { streak++; cursor = addDays(cursor, -1); }
    return streak;
  }
  function completionRate(datesSet, days, targetPerWeek) {
    const target = targetPerWeek || 7;
    let count = 0;
    for (let i = 0; i < days; i++) if (datesSet.has(dateToStr(addDays(new Date(), -i)))) count++;
    const expected = days * (target / 7);
    return Math.min(100, Math.round((count / expected) * 100));
  }
  function currentWeekCount(datesSet) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayDow = today.getDay();
    const weekStart = addDays(today, -todayDow);
    let c = 0;
    for (let d = 0; d <= todayDow; d++) if (datesSet.has(dateToStr(addDays(weekStart, d)))) c++;
    return c;
  }
  function computeWeeklyStreak(datesSet, targetPerWeek) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayDow = today.getDay();
    const weekStart = addDays(today, -todayDow);
    function countInWeek(start) {
      let c = 0;
      for (let d = 0; d < 7; d++) {
        const date = addDays(start, d);
        if (date > today) continue;
        if (datesSet.has(dateToStr(date))) c++;
      }
      return c;
    }
    let streak = 0;
    let cursor = weekStart;
    if (countInWeek(cursor) >= targetPerWeek) streak++;
    cursor = addDays(cursor, -7);
    while (countInWeek(cursor) >= targetPerWeek) { streak++; cursor = addDays(cursor, -7); }
    return streak;
  }
  function habitStats(habit, set) {
    const target = habit.target_per_week || 7;
    if (target >= 7) {
      return {
        streakLabel: `🔥 ${computeStreak(set)}`,
        rateLabel: `30d: ${completionRate(set, 30, 7)}%`,
      };
    }
    const weekCount = currentWeekCount(set);
    return {
      streakLabel: `🔥 ${computeWeeklyStreak(set, target)} sem`,
      rateLabel: `esta semana: ${weekCount}/${target}`,
    };
  }

  /* ============================= HOME ============================= */
  let reorderMode = false;
  let selectedDate = todayStr();

  function dateStripHtml() {
    const todayS = todayStr();
    const sunday = addDays(strToDate(selectedDate), -strToDate(selectedDate).getDay());
    const prevBoundary = addDays(strToDate(todayS), -(DAYS - 7));
    let days = "";
    for (let i = 0; i < 7; i++) {
      const d = addDays(sunday, i);
      const ds = dateToStr(d);
      const isFuture = ds > todayS;
      const isSelected = ds === selectedDate;
      const isToday = ds === todayS;
      const cls = ["date-day", isSelected ? "selected" : "", isToday ? "today" : "", isFuture ? "future" : ""].filter(Boolean).join(" ");
      days += `<div class="${cls}" ${isFuture ? "" : `data-date="${ds}"`}>
        <div class="dow">${WEEKDAYS_SHORT[d.getDay()]}</div>
        <div class="num">${d.getDate()}</div>
      </div>`;
    }
    const prevDisabled = sunday <= prevBoundary;
    return `
      <div class="date-strip">
        <button class="nav-btn" id="date-prev" ${prevDisabled ? "disabled" : ""}>‹</button>
        <div class="days">${days}</div>
        <button class="nav-btn" id="date-next">›</button>
      </div>
    `;
  }

    $app.innerHTML = `
      <header class="topbar">
        <div>

          <div class="subtitle">${escapeHtml(fmtLong(strToDate(selectedDate)))}</div>

          <button class="icon-btn" onclick="location.hash='#/photos'" title="Fotos de progresso">📷</button>
          <button class="icon-btn" onclick="location.hash='#/settings'">⚙️</button>
        </div>
      </header>
      ${dateStripHtml()}
      <div id="list">Carregando…</div>
      <button class="fab" id="add-fab">+</button>
    `;
    document.getElementById("add-fab").onclick = () => openHabitModal();
    document.getElementById("reorder-btn").onclick = () => { reorderMode = !reorderMode; renderHome(); };
    document.getElementById("date-prev").onclick = () => { selectedDate = dateToStr(addDays(strToDate(selectedDate), -7)); renderHome(); };
    document.getElementById("date-next").onclick = () => { selectedDate = dateToStr(addDays(strToDate(selectedDate), 7)); renderHome(); };
    document.querySelectorAll(".date-day[data-date]").forEach(el => {
      el.onclick = () => { selectedDate = el.dataset.date; renderHome(); };
    });

    let habits, logs;
    try {
      habits = await fetchHabits();
      logs = await fetchRecentLogs(DAYS);
    } catch (e) {
      document.getElementById("list").innerHTML = errorBox(e);
      return;
    }

    const list = document.getElementById("list");
    if (!habits.length) {
      list.innerHTML = `<div class="empty-state"><div class="big">🌱</div>
        Nenhum hábito ainda.<br/>Toque no + para adicionar o primeiro.</div>`;
      return;
    }
    list.innerHTML = habits.map((h, idx) => {
      const set = logs[h.id] || new Set();
      const done = set.has(selectedDate);
      const color = escapeHtml(h.color || DEFAULT_COLOR);
      const { streakLabel, rateLabel } = habitStats(h, set);
      return `
      <div class="card habit-row" data-id="${h.id}" style="border-left:4px solid ${color};">
        <div class="emoji">${escapeHtml(h.emoji || "✅")}</div>
        <div class="info${reorderMode ? " no-pointer" : ""}" ${reorderMode ? "" : `data-open="${h.id}"`}>
          <div class="name">${escapeHtml(h.name)}</div>
          <div class="meta"><span class="streak">${streakLabel}</span> · ${rateLabel}</div>
        </div>
        ${reorderMode ? `
          <button class="edit-btn" data-move="up" data-id="${h.id}" ${idx === 0 ? "disabled" : ""}>▲</button>
          <button class="edit-btn" data-move="down" data-id="${h.id}" ${idx === habits.length - 1 ? "disabled" : ""}>▼</button>
        ` : `
          <button class="edit-btn" data-edit="${h.id}">✏️</button>
          <button class="check-toggle ${done ? "done" : ""}" data-toggle="${h.id}" data-color="${color}"
            style="border-color:${color}; ${done ? `background:${color};` : ""}">✓</button>
        `}
      </div>`;
    }).join("");

    if (reorderMode) {
      list.querySelectorAll("[data-move]").forEach(el => {
        el.onclick = async (e) => {
          e.stopPropagation();
          const id = el.dataset.id;
          const dir = el.dataset.move === "up" ? -1 : 1;
          const idx = habits.findIndex(h => h.id === id);
          const swapIdx = idx + dir;
          if (swapIdx < 0 || swapIdx >= habits.length) return;
          const arr = habits.slice();
          [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
          try {
            await Promise.all(arr.map((h, i) => updateHabit(h.id, { sort_order: i })));
            renderHome();
          } catch (err) { alert("Não deu pra reordenar: " + err.message); }
        };
      });
      return;
    }

    list.querySelectorAll("[data-open]").forEach(el => {
      el.onclick = () => { location.hash = `#/habit/${el.dataset.open}`; };
    });
    list.querySelectorAll("[data-edit]").forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const h = habits.find(x => x.id === el.dataset.edit);
        openHabitModal(h);
      };
    });
    list.querySelectorAll("[data-toggle]").forEach(el => {
      el.onclick = async (e) => {
        e.stopPropagation();
        if (el.dataset.busy === "1") return;
        el.dataset.busy = "1";
        const id = el.dataset.toggle;
        const willBeDone = !el.classList.contains("done");
        el.classList.toggle("done", willBeDone);
        el.style.background = willBeDone ? el.dataset.color : "transparent";
        try {
          await toggleLog(id, selectedDate, willBeDone);
          const set = logs[id] || (logs[id] = new Set());
          if (willBeDone) set.add(selectedDate); else set.delete(selectedDate);
          updateRowMeta(id, habits.find(x => x.id === id), set);
        } catch (err) {
          el.classList.toggle("done", !willBeDone);
          el.style.background = !willBeDone ? el.dataset.color : "transparent";
          alert("Não deu pra salvar: " + err.message);
        } finally {
          el.dataset.busy = "";
        }
      };
    });
  }

  function updateRowMeta(id, habit, set) {
    if (!habit) return;
    const row = document.querySelector(`.habit-row[data-id="${id}"] .meta`);
    if (!row) return;
    const { streakLabel, rateLabel } = habitStats(habit, set);
    row.innerHTML = `<span class="streak">${streakLabel}</span> · ${rateLabel}`;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `

        <h2>${isEdit ? "Editar hábito" : "Novo hábito"}</h2>
        <div style="display:flex; gap:10px;">
          <div class="field emoji-field">

          </div>

        </div>

          <label>Frequência</label>
          <select id="m-freq">
            ${[7,6,5,4,3,2,1].map(n => `<option value="${n}" ${currentFreq === n ? "selected" : ""}>${n === 7 ? "Todos os dias" : n + "x por semana"}</option>`).join("")}
          </select>

          <label>Cor</label>
          <div class="color-swatches" id="m-swatches">
            ${HABIT_COLORS.map(c => `<button type="button" class="swatch" data-color="${escapeHtml(c)}" style="background:${escapeHtml(c)};"></button>`).join("")}
            <label class="swatch custom-swatch" id="m-custom-swatch" title="Outra cor"${!HABIT_COLORS.includes(selectedColor) ? ` style="background:${escapeHtml(selectedColor)};"` : ""}>
              <input type="color" id="m-color-custom" value="${escapeHtml(selectedColor)}" />
            </label>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="m-cancel">Cancelar</button>
          <button class="btn btn-primary" id="m-save">Salvar</button>
        </div>
        ${isEdit ? `
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-secondary" id="m-archive">Arquivar</button>
            <button class="btn btn-danger" id="m-delete">Excluir</button>
          </div>` : ""}
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById("m-cancel").onclick = () => overlay.remove();
    document.getElementById("m-name").focus();

    function markSelectedColor(color) {
      overlay.querySelectorAll(".swatch[data-color]").forEach(s => s.classList.remove("selected"));
      document.getElementById("m-custom-swatch").classList.remove("selected");
      const preset = overlay.querySelector(`.swatch[data-color="${CSS.escape(color)}"]`);
      if (preset) preset.classList.add("selected");
      else document.getElementById("m-custom-swatch").classList.add("selected");
    }
    markSelectedColor(selectedColor);
    overlay.querySelectorAll(".swatch[data-color]").forEach(s => {
      s.onclick = () => { selectedColor = s.dataset.color; markSelectedColor(selectedColor); };
    });
    document.getElementById("m-color-custom").oninput = (e) => {
      selectedColor = e.target.value;
      document.getElementById("m-custom-swatch").style.background = selectedColor;
      markSelectedColor(selectedColor);
    };

    document.getElementById("m-save").onclick = async () => {
      const name = document.getElementById("m-name").value.trim();
      const emoji = document.getElementById("m-emoji").value.trim() || "✅";
      const targetPerWeek = Number(document.getElementById("m-freq").value) || 7;
      if (!name) { alert("Dá um nome pro hábito."); return; }
      try {
        if (isEdit) await updateHabit(habit.id, { name, emoji, target_per_week: targetPerWeek, color: selectedColor });
        else await createHabit(name, emoji, targetPerWeek, selectedColor);
        overlay.remove();
        render();
      } catch (e) { alert("Não deu pra salvar: " + e.message); }
    };

    if (isEdit) {
      document.getElementById("m-archive").onclick = async () => {
        try { await updateHabit(habit.id, { archived: true }); overlay.remove(); location.hash = "#/"; render(); }
        catch (e) { alert("Não deu pra arquivar: " + e.message); }

      document.getElementById("m-delete").onclick = async () => {
        if (!confirm(`Excluir "${habit.name}" e todo o histórico dele? Não dá pra desfazer.`)) return;

        catch (e) { alert("Não deu pra excluir: " + e.message); }
      };
    }
  }

  function paintDetail(habit, logSet, total) {
    const target = habit.target_per_week || 7;
    const isDaily = target >= 7;
    const createdAt = habit.created_at ? new Date(habit.created_at) : null;
    const color = escapeHtml(habit.color || DEFAULT_COLOR);

    let tile1, tile2;
    if (isDaily) {
      const streak = computeStreak(logSet);
      const rate30 = completionRate(logSet, 30, 7);
      tile1 = `<div class="stat-tile"><div class="value">🔥 ${streak}</div><div class="label">sequência (dias)</div></div>`;
      tile2 = `<div class="stat-tile"><div class="value">${rate30}%</div><div class="label">últimos 30 dias</div></div>`;
    } else {
      const streakWeeks = computeWeeklyStreak(logSet, target);
      const weekCount = currentWeekCount(logSet);
      tile1 = `<div class="stat-tile"><div class="value">🔥 ${streakWeeks}</div><div class="label">sequência (semanas)</div></div>`;
      tile2 = `<div class="stat-tile"><div class="value">${weekCount}/${target}</div><div class="label">esta semana</div></div>`;
    }
    const tile3 = `<div class="stat-tile"><div class="value">${total}</div><div class="label">total de vezes</div></div>`;

    $app.innerHTML = `
      <button class="back-btn" onclick="location.hash='#/'">‹ Voltar</button>

        <div class="emoji">${escapeHtml(habit.emoji || "✅")}</div>

          <div class="name">${escapeHtml(habit.name)}</div>
          ${!isDaily ? `<div style="font-size:12px; color:var(--text-secondary);">${target}x por semana</div>` : ""}
        </div>
        <button class="icon-btn" id="edit-open">✏️</button>
      </div>

      <div class="stat-row">${tile1}${tile2}${tile3}</div>

      <div class="section-title">Últimas ${WEEKS} semanas</div>
      <div class="card viz-card">
        <div id="heatmap"></div>
        <div class="tooltip-line" id="heatmap-tip">Toque em um dia para marcar/desmarcar</div>
      </div>

      <div class="section-title">Tendência semanal</div>
      <div class="card viz-card">
        <div id="trend"></div>
        <div class="tooltip-line" id="trend-tip">Toque em um ponto para ver a semana</div>
      </div>
    `;

    document.getElementById("edit-open").onclick = () => openHabitModal(habit);
    drawHeatmap(document.getElementById("heatmap"), document.getElementById("heatmap-tip"), logSet, createdAt, habit.id, color, (ds, done) => {

      total += done ? 1 : -1;
      paintDetail(habit, logSet, total);
    });
    drawTrend(document.getElementById("trend"), document.getElementById("trend-tip"), logSet, createdAt, color);
  }

  // ---- heatmap (grade estilo GitHub, cor única = série do hábito) ----
  function drawHeatmap(container, tipEl, logSet, createdAt, habitId, color, onChange) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayDow = today.getDay();
    const currentWeekSunday = addDays(today, -todayDow);
    const startSunday = addDays(currentWeekSunday, -(WEEKS - 1) * 7);

    const cell = 12, gap = 3, step = cell + gap;
    const width = WEEKS * step - gap;
    const height = 7 * step - gap + 16; // +16 pra rótulos de mês

    let cells = "";
    let monthLabels = "";
    let lastMonth = null;
    for (let w = 0; w < WEEKS; w++) {
      const colDate = addDays(startSunday, w * 7);
      const m = colDate.getMonth();
      if (m !== lastMonth) {
        monthLabels += `<text x="${w*step}" y="10" font-size="9" fill="var(--text-muted)">${MONTHS_SHORT[m]}</text>`;
        lastMonth = m;
      }
      for (let d = 0; d < 7; d++) {
        const date = addDays(startSunday, w * 7 + d);
        const ds = dateToStr(date);
        const x = w * step, y = d * step + 16;
        const isFuture = date > today;
        let fill, extra = "";
        if (isFuture) {
          fill = "transparent";
        } else if (logSet.has(ds)) {
          fill = color;
        } else {
          fill = "var(--gridline)";
        }
        if (ds === todayStr()) extra = `stroke="var(--text-primary)" stroke-width="2"`;
        const clickable = !isFuture;
        cells += `<rect class="cell" data-date="${ds}" data-done="${logSet.has(ds)}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="${fill}" ${extra} ${clickable ? "" : 'pointer-events="none"'} />`;
      }
    }

    container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${monthLabels}${cells}</svg>`;
    container.querySelectorAll(".cell").forEach(c => {
      c.addEventListener("click", async () => {
        if (tipEl.dataset.busy === "1") return;
        const ds = c.dataset.date;
        const d = strToDate(ds);
        const wasDone = c.dataset.done === "true";
        const newDone = !wasDone;
        tipEl.dataset.busy = "1";
        tipEl.innerHTML = `<b>${escapeHtml(fmtLong(d))}</b> — salvando…`;
        try {
          await toggleLog(habitId, ds, newDone);
          onChange(ds, newDone);
        } catch (err) {
          tipEl.innerHTML = `<b>${escapeHtml(fmtLong(d))}</b> — erro: ${escapeHtml(err.message)}`;
          tipEl.dataset.busy = "";
        }
      });
    });
  }

  // ---- tendência semanal (linha, série única) ----
  function drawTrend(container, tipEl, logSet, createdAt, color) {
    const today = new Date(); today.setHours(0,0,0,0);
    const todayDow = today.getDay();
    const currentWeekSunday = addDays(today, -todayDow);
    const startSunday = addDays(currentWeekSunday, -(WEEKS - 1) * 7);

    const points = [];
    for (let w = 0; w < WEEKS; w++) {
      const weekStart = addDays(startSunday, w * 7);
      let elapsed = 0, done = 0;
      for (let d = 0; d < 7; d++) {
        const date = addDays(weekStart, d);
        if (date > today) continue;
        if (createdAt && date < new Date(createdAt.getFullYear(), createdAt.getMonth(), createdAt.getDate())) continue;
        elapsed++;
        if (logSet.has(dateToStr(date))) done++;
      }
      points.push({ weekStart, pct: elapsed > 0 ? Math.round((done / elapsed) * 100) : null });
    }

    const w = 320, h = 130, padL = 26, padR = 8, padT = 10, padB = 20;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const valid = points.filter(p => p.pct !== null);
    const xFor = (i) => padL + (i / (WEEKS - 1)) * plotW;
    const yFor = (pct) => padT + plotH - (pct / 100) * plotH;

    let grid = "";
    [0, 50, 100].forEach(v => {
      const y = yFor(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--gridline)" stroke-width="1" />`;
      grid += `<text x="0" y="${y+3}" font-size="9" fill="var(--text-muted)">${v}%</text>`;
    });

    let path = "";
    valid.forEach((p, i) => {
      const idx = points.indexOf(p);
      const x = xFor(idx), y = yFor(p.pct);
      path += (path === "" ? "M" : " L") + x.toFixed(1) + " " + y.toFixed(1);
    });

    let dots = "";
    points.forEach((p, i) => {
      if (p.pct === null) return;
      const x = xFor(i), y = yFor(p.pct);
      dots += `<circle class="cell" data-i="${i}" cx="${x}" cy="${y}" r="9" fill="transparent" />`;
      dots += `<circle cx="${x}" cy="${y}" r="3" fill="${color}" pointer-events="none" />`;
    });

    const firstLabel = fmtShort(points[0].weekStart);
    const lastLabel = fmtShort(points[points.length-1].weekStart);

    container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      ${grid}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${dots}
      <text x="${padL}" y="${h-4}" font-size="9" fill="var(--text-muted)">${firstLabel}</text>
      <text x="${w-padR}" y="${h-4}" font-size="9" fill="var(--text-muted)" text-anchor="end">${lastLabel}</text>
    </svg>`;

    container.querySelectorAll(".cell").forEach(c => {
      c.addEventListener("click", () => {
        const i = Number(c.dataset.i);
        const p = points[i];
        const weekEnd = addDays(p.weekStart, 6);
        tipEl.innerHTML = `Semana de <b>${escapeHtml(fmtShort(p.weekStart))} a ${escapeHtml(fmtShort(weekEnd))}</b>: ${p.pct}%`;
      });
    });
  }

  /* ============================= SETTINGS ============================= */
  function renderSettings() {
    $app.innerHTML = `
      <button class="back-btn" onclick="location.hash='#/'">‹ Voltar</button>
      <header class="topbar"><div class="title">Configurações</div></header>
      <div class="card" style="padding:16px;">
        <div class="help-text" style="margin-top:0;">Conectado como <b style="color:var(--text-primary);">${escapeHtml(currentUser.email || "")}</b></div>
        <button class="btn btn-secondary" style="width:100%; margin-top:12px;" id="s-logout">Sair</button>
      </div>
      <div class="section-title">Hábitos arquivados</div>
      <div class="card" id="archived-box" style="padding:8px;">Carregando…</div>
    `;
    document.getElementById("s-logout").onclick = async () => {
      try { await signOut(); }
      catch (e) { alert("Não deu pra sair: " + e.message); }
    };
    loadArchivedList();
  }

  async function loadArchivedList() {
    const box = document.getElementById("archived-box");
    if (!box) return;
    let archived;
    try { archived = await fetchArchivedHabits(); }
    catch (e) { box.innerHTML = errorBox(e); return; }
    if (!archived.length) {
      box.innerHTML = `<div class="help-text" style="padding:8px;">Nenhum hábito arquivado.</div>`;
      return;
    }
    box.innerHTML = archived.map(h => `
      <div class="archived-row" data-id="${h.id}">
        <div class="emoji" style="font-size:18px;">${escapeHtml(h.emoji || "✅")}</div>
        <div class="name">${escapeHtml(h.name)}</div>
        <button data-restore="${h.id}">Restaurar</button>
        <button data-wipe="${h.id}">Excluir</button>
      </div>
    `).join("");
    box.querySelectorAll("[data-restore]").forEach(el => {
      el.onclick = async () => {
        try { await updateHabit(el.dataset.restore, { archived: false }); loadArchivedList(); }
        catch (e) { alert("Não deu pra restaurar: " + e.message); }
      };
    });
    box.querySelectorAll("[data-wipe]").forEach(el => {
      el.onclick = async () => {
        const h = archived.find(x => x.id === el.dataset.wipe);
        if (!confirm(`Excluir "${h.name}" e todo o histórico dele? Não dá pra desfazer.`)) return;
        try { await deleteHabit(el.dataset.wipe); loadArchivedList(); }
        catch (e) { alert("Não deu pra excluir: " + e.message); }
      };
    });
  }

  /* ============================= FOTOS ============================= */
  async function renderPhotos() {
    $app.innerHTML = `
      <button class="back-btn" onclick="location.hash='#/'">‹ Voltar</button>
      <header class="topbar">
        <div class="title">Fotos</div>
        <button class="icon-btn" onclick="location.hash='#/photos/player'" title="Ver evolução">▶️</button>
      </header>
      <div id="checkins-list">Carregando…</div>
      <button class="fab" id="add-checkin-fab">+</button>
    `;
    document.getElementById("add-checkin-fab").onclick = () => openCheckinModal();

    let checkins;
    try { checkins = await fetchCheckins(); }
    catch (e) { document.getElementById("checkins-list").innerHTML = errorBox(e); return; }

    const list = document.getElementById("checkins-list");
    if (!checkins.length) {
      list.innerHTML = `<div class="empty-state"><div class="big">📷</div>
        Nenhum registro ainda.<br/>Toque no + pra adicionar fotos e medidas.</div>`;
      return;
    }

    list.innerHTML = checkins.map(c => {
      const metrics = [
        c.weight_kg != null ? `${c.weight_kg} kg` : null,
        c.body_fat_pct != null ? `${c.body_fat_pct}% gordura` : null,
      ].filter(Boolean).join(" · ");
      const thumbs = ANGLES.map(a => {
        const path = c[`photo_${a.key}`] || "";
        return `<div class="t" data-thumb data-path="${escapeHtml(path)}">${path ? "" : a.label[0]}</div>`;
      }).join("");
      return `
      <div class="card checkin-row" data-id="${c.id}">
        <div class="head">
          <div>
            <div class="date">${escapeHtml(fmtLong(strToDate(c.checkin_date)))}</div>
            ${metrics ? `<div class="metrics">${escapeHtml(metrics)}</div>` : ""}
          </div>
          <div style="display:flex; gap:4px;">
            <button class="edit-btn" data-edit="${c.id}">✏️</button>
            <button class="del-btn" data-del="${c.id}">🗑️</button>
          </div>
        </div>
        <div class="thumbs">${thumbs}</div>
      </div>`;
    }).join("");

    list.querySelectorAll("[data-thumb]").forEach((el) => {
      const path = el.dataset.path;
      if (!path) return;
      getSignedUrl(path).then(url => { el.innerHTML = `<img src="${url}" />`; }).catch(() => {});
    });

    list.querySelectorAll("[data-edit]").forEach(el => {
      el.onclick = () => { const c = checkins.find(x => x.id === el.dataset.edit); openCheckinModal(c); };
    });
    list.querySelectorAll("[data-del]").forEach(el => {
      el.onclick = async () => {
        const c = checkins.find(x => x.id === el.dataset.del);
        if (!confirm(`Excluir o registro de ${fmtLong(strToDate(c.checkin_date))}? Não dá pra desfazer.`)) return;
        try { await deleteCheckin(c); renderPhotos(); }
        catch (e) { alert("Não deu pra excluir: " + e.message); }
      };
    });
  }

  function openCheckinModal(checkin) {
    const isEdit = !!checkin;
    const dateVal = checkin ? checkin.checkin_date : todayStr();
    const pendingFiles = {};
    const existingPaths = {};
    ANGLES.forEach(a => { existingPaths[a.key] = checkin ? (checkin[`photo_${a.key}`] || null) : null; });

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="sheet">
        <h2>${isEdit ? "Editar registro" : "Novo registro"}</h2>
        <div class="field">
          <label>Data</label>
          <input id="ck-date" type="date" value="${dateVal}" max="${todayStr()}" />
        </div>
        <div class="photo-grid" id="ck-photo-grid" style="margin-bottom:14px;">
          ${ANGLES.map(a => `
            <label class="photo-slot" data-angle="${a.key}">
              <div class="placeholder">+ ${a.label}</div>
              <div class="angle-label">${a.label}</div>
              <input type="file" accept="image/*" capture="environment" data-angle-input="${a.key}" />
            </label>
          `).join("")}
        </div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1">
            <label>Peso (kg)</label>
            <input id="ck-weight" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 78.5" value="${checkin?.weight_kg ?? ""}" />
          </div>
          <div class="field" style="flex:1">
            <label>% gordura</label>
            <input id="ck-fat" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 18.2" value="${checkin?.body_fat_pct ?? ""}" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="ck-cancel">Cancelar</button>
          <button class="btn btn-primary" id="ck-save">Salvar</button>
        </div>
        ${isEdit ? `<button class="btn btn-danger" id="ck-delete" style="width:100%;margin-top:10px;">Excluir registro</button>` : ""}
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById("ck-cancel").onclick = () => overlay.remove();

    ANGLES.forEach((a) => {
      const path = existingPaths[a.key];
      if (!path) return;
      getSignedUrl(path).then(url => {
        const slot = overlay.querySelector(`.photo-slot[data-angle="${a.key}"]`);
        const ph = slot && slot.querySelector(".placeholder");
        if (ph) ph.outerHTML = `<img src="${url}" />`;
      }).catch(() => {});
    });

    overlay.querySelectorAll("[data-angle-input]").forEach(input => {
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        pendingFiles[input.dataset.angleInput] = file;
        const slot = input.closest(".photo-slot");
        const url = URL.createObjectURL(file);
        const existingImg = slot.querySelector("img");
        const placeholder = slot.querySelector(".placeholder");
        if (existingImg) existingImg.src = url;
        else if (placeholder) placeholder.outerHTML = `<img src="${url}" />`;
      };
    });

    document.getElementById("ck-save").onclick = async () => {
      const dateStr = document.getElementById("ck-date").value;
      if (!dateStr) { alert("Escolhe uma data."); return; }
      const weightVal = document.getElementById("ck-weight").value.trim();
      const fatVal = document.getElementById("ck-fat").value.trim();
      const hasAnyPhoto = ANGLES.some(a => pendingFiles[a.key] || existingPaths[a.key]);
      if (!hasAnyPhoto) { alert("Adiciona pelo menos uma foto."); return; }

      const saveBtn = document.getElementById("ck-save");
      saveBtn.disabled = true; saveBtn.textContent = "Salvando…";
      try {
        const fields = {
          weight_kg: weightVal ? Number(weightVal) : null,
          body_fat_pct: fatVal ? Number(fatVal) : null,
        };
        for (const a of ANGLES) {
          if (pendingFiles[a.key]) fields[`photo_${a.key}`] = await uploadCheckinPhoto(dateStr, a.key, pendingFiles[a.key]);
          else if (existingPaths[a.key]) fields[`photo_${a.key}`] = existingPaths[a.key];
        }
        await upsertCheckin(dateStr, fields);
        if (isEdit && checkin.checkin_date !== dateStr) {
          await client().from("body_checkins").delete().eq("id", checkin.id);
        }
        overlay.remove();
        renderPhotos();
      } catch (e) {
        alert("Não deu pra salvar: " + e.message);
        saveBtn.disabled = false; saveBtn.textContent = "Salvar";
      }
    };

    if (isEdit) {
      document.getElementById("ck-delete").onclick = async () => {
        if (!confirm(`Excluir o registro de ${fmtLong(strToDate(checkin.checkin_date))}? Não dá pra desfazer.`)) return;
        try { await deleteCheckin(checkin); overlay.remove(); renderPhotos(); }
        catch (e) { alert("Não deu pra excluir: " + e.message); }
      };
    }
  }

  /* ---------- player de evolução ---------- */
  let playerAngle = "front";
  let playerFrameIndex = 0;
  let playerTimer = null;
  let playerFps = 2;

  function stopPlayer() {
    if (playerTimer) { clearInterval(playerTimer); playerTimer = null; }
  }

  async function renderPhotoPlayer() {
    stopPlayer();
    $app.innerHTML = `
      <button class="back-btn" onclick="location.hash='#/photos'">‹ Voltar</button>
      <header class="topbar"><div class="title">Evolução</div></header>
      <div class="angle-tabs" id="angle-tabs">
        ${ANGLES.map(a => `<button data-angle="${a.key}" class="${a.key === playerAngle ? "active" : ""}">${a.label}</button>`).join("")}
      </div>
      <div class="player-frame" id="player-frame"><div class="empty">Carregando…</div></div>
      <div class="player-controls">
        <button class="icon-btn" id="player-playpause">▶️</button>
        <input type="range" id="player-speed" min="1" max="8" step="1" value="${playerFps}" />
        <div class="speed-label" id="speed-label">${playerFps} fps</div>
      </div>
    `;
    document.getElementById("angle-tabs").querySelectorAll("[data-angle]").forEach(btn => {
      btn.onclick = () => { playerAngle = btn.dataset.angle; playerFrameIndex = 0; renderPhotoPlayer(); };
    });

    let checkins;
    try { checkins = await fetchCheckins(); }
    catch (e) { document.getElementById("player-frame").innerHTML = `<div class="empty">Erro: ${escapeHtml(e.message)}</div>`; return; }

    const frames = checkins
      .filter(c => c[`photo_${playerAngle}`])
      .sort((a, b) => a.checkin_date < b.checkin_date ? -1 : 1);

    const frameEl = document.getElementById("player-frame");
    const playBtn = document.getElementById("player-playpause");
    if (!frames.length) {
      frameEl.innerHTML = `<div class="empty">Nenhuma foto desse ângulo ainda.</div>`;
      playBtn.disabled = true;
      return;
    }

    const urls = await Promise.all(frames.map(f => getSignedUrl(f[`photo_${playerAngle}`])));

    function paint() {
      const i = playerFrameIndex % frames.length;
      frameEl.innerHTML = `<img src="${urls[i]}" /><div class="date-badge">${escapeHtml(fmtLong(strToDate(frames[i].checkin_date)))}</div>`;
    }
    paint();

    function start() {
      stopPlayer();
      playerTimer = setInterval(() => {
        if (!document.body.contains(frameEl)) { stopPlayer(); return; }
        playerFrameIndex = (playerFrameIndex + 1) % frames.length;
        paint();
      }, 1000 / playerFps);
    }

    document.getElementById("player-speed").oninput = (e) => {
      playerFps = Number(e.target.value);
      document.getElementById("speed-label").textContent = `${playerFps} fps`;
      if (playerTimer) start();
    };
    playBtn.onclick = () => {
      if (playerTimer) { stopPlayer(); playBtn.textContent = "▶️"; }
      else { start(); playBtn.textContent = "⏸️"; }
    };
  }
})();
</script>
